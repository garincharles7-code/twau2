<!DOCTYPE html>
<html>
    <head>
        <title> Teltale Login </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel = "Stylesheet" href = "CSS/login.css">
        <link rel = "Stylesheet" href = "CSS/loading.css">
        <link rel="icon" type="image/png" href="Pics/Site-Logo.png">
    </head>
    
    <body>
        <div class ="loading-screen">
          <img src = "Pics/LoadingLogo.png" class ="loader-logo" alt = "Loading Logo">
        </div>

        <script src="ScreenLoading.js"></script>
        
        <video muted autoplay loop disablepictureinpicture src = "Vids/main.mp4" class = "vid"> </video>
           
        <div class="vid-overlay"></div>
        
        <div class = "Mcontainer">
            <img src = "Pics/img.png" alt = "Teltale Logo">
            <div class = "container">
                <h3> Username </h3>
                <input type = "textbox" class = "textBox"> </input>
                <h3> Password </h3>
                <input type = "password" class = "textBox"> </input>
                <div class = "infoRow">
                    <label> <input type = "checkbox" class = "checkbox"> Remember Me? </label>
                    <a href = "" class = "forgotP"> Forgot Password? </a>
                </div>
                <a href = "Home.html">
                    <button> Let's Go! </button>
                </a>
                
                <div class = "signUpRow">
                    <p> No Teltale Account yet? </p>
                    <a href = "" class = "signUp"> Sign up </a>
                </div>
            </div>
        </div>
        
    </body>
</html>
